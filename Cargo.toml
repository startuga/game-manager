[workspace]
members = ["app", "core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

# windows-rs crates always come from the official repository's master branch, not crates.io.
# Cargo.lock pins the commit; `cargo update` moves them all to the latest one.
[workspace.dependencies]
windows = { git = "https://github.com/microsoft/windows-rs" }
windows-canvas = { git = "https://github.com/microsoft/windows-rs", features = ["system"] }
windows-core = { git = "https://github.com/microsoft/windows-rs" }
windows-registry = { git = "https://github.com/microsoft/windows-rs" }
windows-text = { git = "https://github.com/microsoft/windows-rs" }
windows-threading = { git = "https://github.com/microsoft/windows-rs" }
windows-window = { git = "https://github.com/microsoft/windows-rs" }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# Every crate opts in with `[lints] workspace = true`. They enforce the conventions in CLAUDE.md:
# each unsafe operation in its own block with a `// SAFETY:` comment, no unwrap/expect outside
# tests (clippy.toml allows them there).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

# Tuned for speed: optimizations across crates (`lto`) in one unit, no unwinding code (nothing
# catches a panic). `strip` only drops symbols, which costs nothing at run time. A clean release
# build takes about twice as long as with the defaults.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
