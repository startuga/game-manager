[package]
name = "gm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
fast_image_resize = { workspace = true }
image-webp = { workspace = true }
png = { workspace = true }
zune-jpeg = { workspace = true }
# Win32 features are named after C headers: launcher (shellapi, winuser), the Shell's COM
# objects (shlobj_core, combaseapi, objbase, objidlbase, wtypes, wtypesbase, ocidl, windef) and
# known folders (knownfolders, shtypes: Documents and Saved Games wherever they were moved),
# EA resources (libloaderapi, minwindef), version info (winver), shortcuts (shobjidl_core, objidl,
# coml2api), web requests (winhttp), Xbox packages and their architecture (WinRT
# Management_Deployment, ApplicationModel, System), mod files as administrator and 7-Zip (synchapi,
# processthreadsapi, handleapi, winbase, winerror) with long work's hash and file name (bcrypt),
# a resource checked against its mapping (memoryapi),
# who runs it and file permissions (winnt, securitybaseapi, sddl, aclapi, accctrl), the
# signatures of upscaler DLLs and their signers (wintrust, mscat, mssip, wincrypt, shared), and My PC:
# hardware, memory modules and drives (sysinfoapi, fileapi), displays (wingdi) and their colour
# profiles (icm).
windows = { workspace = true, features = [
    "shellapi", "winuser",
    "shlobj_core", "combaseapi", "objbase", "objidlbase", "wtypes", "wtypesbase", "ocidl", "windef",
    "knownfolders", "shtypes",
    "libloaderapi", "minwindef",
    "winver",
    "shobjidl_core", "objidl", "coml2api",
    "winhttp",
    "Management_Deployment", "ApplicationModel", "System",
    "synchapi", "processthreadsapi", "handleapi", "winbase", "winerror", "bcrypt", "memoryapi",
    "winnt", "securitybaseapi", "sddl", "aclapi", "accctrl",
    "wintrust", "mscat", "mssip", "wincrypt", "shared",
    "sysinfoapi", "fileapi", "wingdi", "icm",
] }
windows-registry = { workspace = true }
