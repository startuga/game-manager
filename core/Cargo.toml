[package]
name = "gm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Win32 features are named after C headers: launcher (shellapi, winuser), icons (wincodec,
# shlobj_core, shlwapi, combaseapi, objbase, objidlbase, wtypes, wtypesbase, ocidl, windef),
# EA resources (libloaderapi, minwindef), version info (winver), shortcuts (shobjidl_core, objidl,
# coml2api), Xbox packages and their architecture (WinRT Management_Deployment, ApplicationModel,
# System).
windows = { workspace = true, features = [
    "shellapi", "winuser",
    "wincodec", "shlobj_core", "shlwapi", "combaseapi", "objbase", "objidlbase", "wtypes", "wtypesbase", "ocidl", "windef",
    "libloaderapi", "minwindef",
    "winver",
    "shobjidl_core", "objidl", "coml2api",
    "Management_Deployment", "ApplicationModel", "System",
] }
windows-registry = { workspace = true }
