[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
gm-core = { path = "../core" }
# The startup error dialog (winuser) and the "Windows App Runtime missing" code (winerror).
windows = { workspace = true, features = ["winuser", "winerror"] }
windows-pickers = { workspace = true, features = ["reactor"] }
windows-reactor = { workspace = true }
# For the WinUI calls the reactor has no API for (`winui_bindings.rs`, generated), and boxing
# their struct values (`compact.rs`).
windows-collections = { workspace = true }
windows-core = { workspace = true }
windows-reference = { workspace = true }

[dev-dependencies]
# `examples/winui_bindings.rs`, which generates `src/winui_bindings.rs`.
serde_json = { workspace = true }
windows-bindgen = { workspace = true }
