[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
gm-core = { path = "../core" }
# The window drawn with Direct2D (windows-canvas, `system` host) and DirectWrite (windows-text),
# its HWND and message loop (windows-window), and background work on the thread pool.
windows-canvas = { workspace = true }
windows-core = { workspace = true }
windows-text = { workspace = true }
windows-threading = { workspace = true }
windows-window = { workspace = true }
# Win32 features are named after C headers: the window's frame and messages (winuser, dwmapi,
# shellapi for dropped files), the text boxes' IME (imm), the Open dialog (shobjidl_core, shtypes,
# combaseapi, objbase), pictures and clipping (d2d, dcommon; d3d11 to trim GPU memory), UI Automation
# (uiautomationcore, uiautomationcoreapi, uiautomationclient, oleauto), efficiency mode
# (processthreadsapi, memoryapi) and the start error (winerror). No GDI (wingdi): everything is
# drawn with Direct2D, and pictures are decoded in pure Rust (`gm_core::picture`).
windows = { workspace = true, features = [
    "winuser", "dwmapi", "shellapi", "uxtheme",
    "imm",
    "shobjidl_core", "shtypes", "combaseapi", "objbase", "objidl", "objidlbase", "wtypesbase",
    "d2d", "dcommon", "d3d11",
    "uiautomationcore", "uiautomationcoreapi", "uiautomationclient", "oleauto", "oaidl", "propidl", "shared", "winnt", "wtypes",
    "processthreadsapi", "memoryapi", "winbase",
    "winerror", "windef", "minwindef",
] }
